<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NozaBoard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0d1117;
  color: #e6edf3;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding-left: 56px;
}
.login-container {
  text-align: center;
  padding: 48px;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  max-width: 400px;
  width: 90%;
}
.login-container h1 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #e6edf3, #58a6ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.login-container p {
  font-size: 13px;
  color: #8b949e;
  margin-bottom: 24px;
}
.login-input {
  width: 100%;
  padding: 12px 16px;
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
  color: #e6edf3;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.login-input:focus { border-color: #58a6ff; }
.login-btn {
  width: 100%;
  padding: 12px;
  margin-top: 16px;
  background: linear-gradient(135deg, #238636, #3fb950);
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
.login-btn:hover { opacity: 0.9; }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.error { color: #f85149; font-size: 13px; margin-top: 12px; display: none; }
.loading { color: #8b949e; font-size: 13px; margin-top: 12px; display: none; }

/* ── Side Nav ── */
.side-nav {
  position: fixed; top: 0; left: 0; width: 56px; height: 100vh;
  background: #161b22; border-right: 1px solid #30363d;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0; z-index: 200; overflow: hidden;
  transition: width 0.2s ease;
}
.side-nav:hover { width: 140px; }
.side-nav-item {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 10px 16px; color: #6e7681; text-decoration: none;
  font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden;
  border-radius: 0; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.side-nav-item:hover { background: #1c2129; color: #e6edf3; }
.side-nav-item.active { color: #58a6ff; background: rgba(88,166,255,0.08); border-right: 2px solid #58a6ff; }
.side-nav-item span:last-child { opacity: 0; transition: opacity 0.15s; }
.side-nav:hover .side-nav-item span:last-child { opacity: 1; }

/* ── Mobile Bottom Nav ── */
.mobile-bottom-nav {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0;
  background: #161b22; border-top: 1px solid #30363d;
  height: 56px; z-index: 900;
  padding-bottom: env(safe-area-inset-bottom);
  justify-content: space-around; align-items: stretch;
}
.mobile-bottom-nav .mbn-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; color: #6e7681; text-decoration: none; font-size: 10px; font-weight: 600;
  transition: color 0.15s;
}
.mobile-bottom-nav .mbn-item:hover,
.mobile-bottom-nav .mbn-item:active { color: #e6edf3; }
.mobile-bottom-nav .mbn-item.active { color: #58a6ff; }
.mobile-bottom-nav .mbn-icon { font-size: 20px; line-height: 1; }
.mobile-bottom-nav .mbn-label { font-size: 10px; }
body.light .mobile-bottom-nav { background: #fff; border-top-color: #d8dde4; }
body.light .mobile-bottom-nav .mbn-item { color: #8b95a5; }
body.light .mobile-bottom-nav .mbn-item.active { color: #5aadff; }

@media (max-width: 768px) {
  .side-nav { display: none; }
  body { padding-left: 0; padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
  .mobile-bottom-nav { display: flex; }
}
</style>
</head>
<body>

<!-- ナビ項目は nav.js が流し込む（全ページ共通） -->
<nav class="side-nav" id="sideNav"></nav>
<nav class="mobile-bottom-nav" id="mobileBottomNav"></nav>

<div class="login-container" id="loginScreen">
  <h1>NozaBoard</h1>
  <p>業務自動化ダッシュボード</p>
  <input type="password" class="login-input" id="passwordInput" placeholder="パスワードを入力" autofocus>
  <button class="login-btn" id="loginBtn" onclick="unlock()">ログイン</button>
  <div class="error" id="error">パスワードが正しくありません</div>
  <div class="loading" id="loading">復号中...</div>
</div>

<script>
document.getElementById('passwordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') unlock();
});

async function decryptAndShow(password) {
  const resp = await fetch('encrypted.json');
  const payload = await resp.json();

  const salt = Uint8Array.from(atob(payload.salt), c => c.charCodeAt(0));
  const iv = Uint8Array.from(atob(payload.iv), c => c.charCodeAt(0));
  const encData = Uint8Array.from(atob(payload.data), c => c.charCodeAt(0));

  const keyMaterial = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-CBC', length: 256 },
    false,
    ['decrypt']
  );

  const decrypted = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, key, encData);
  const html = new TextDecoder().decode(decrypted);

  if (!html.includes('<!DOCTYPE html>') && !html.includes('<html')) {
    throw new Error('Invalid password');
  }

  localStorage.setItem('dk_pass', password);
  localStorage.setItem('dk_ts', Date.now().toString());

  // 復号後のページに テーマ切替 を注入する
  // （サイドナビ / ボトムナビ / G→数字 は復号後HTMLが読み込む nav.js が担当）
  const injectScript = `<script>
(function(){
  if (document.querySelector('.theme-toggle')) return;
  var s = document.createElement('style');
  s.textContent = '.theme-toggle{position:fixed;bottom:12px;left:10px;z-index:210;width:44px;height:44px;border-radius:50%;border:1px solid #30363d;background:#161b22;color:#8b949e;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.2)}.theme-toggle:hover{background:#1c2129;color:#e6edf3}.light .theme-toggle,body.light .theme-toggle{background:#fff;border-color:#d8dde4;color:#5a6270}';
  document.head.appendChild(s);
  var saved = localStorage.getItem('noza_theme');
  if (saved === 'light') document.body.classList.add('light');
  var tb = document.createElement('button');
  tb.className = 'theme-toggle'; tb.innerHTML = '\\u26d1'; tb.title = 'テーマ切替 (T)';
  tb.onclick = function(){ document.body.classList.toggle('light'); localStorage.setItem('noza_theme', document.body.classList.contains('light') ? 'light' : 'dark'); };
  document.body.appendChild(tb);
  document.addEventListener('keydown', function(e){
    var el = document.activeElement;
    if (el && (['INPUT','TEXTAREA','SELECT'].indexOf(el.tagName)>=0 || el.isContentEditable)) return;
    if (e.altKey||e.ctrlKey||e.metaKey) return;
    if (e.key==='t'||e.key==='T'){e.preventDefault();tb.click();}
  });
})();
<\/script>`;

  // Insert inject script before </body> in decrypted HTML
  let modifiedHtml = html;
  if (html.includes('</body>')) {
    modifiedHtml = html.replace('</body>', injectScript + '</body>');
  } else {
    modifiedHtml = html + injectScript;
  }

  document.open();
  document.write(modifiedHtml);
  document.close();
}

async function unlock() {
  const password = document.getElementById('passwordInput').value;
  if (!password) return;

  const btn = document.getElementById('loginBtn');
  const error = document.getElementById('error');
  const loading = document.getElementById('loading');
  btn.disabled = true;
  error.style.display = 'none';
  loading.style.display = 'block';

  try {
    await decryptAndShow(password);
  } catch (e) {
    error.style.display = 'block';
    loading.style.display = 'none';
    btn.disabled = false;
    document.getElementById('passwordInput').select();
  }
}

// Auto-login if session exists
(async function() {
  const storedPass = localStorage.getItem('dk_pass');
  const storedTs = localStorage.getItem('dk_ts');
  if (storedPass && storedTs) {
    const elapsed = Date.now() - parseInt(storedTs, 10);
    if (elapsed < 30 * 24 * 60 * 60 * 1000) {
      try {
        await decryptAndShow(storedPass);
      } catch (e) {
        localStorage.removeItem('dk_pass');
        localStorage.removeItem('dk_ts');
      }
    }
  }
})();
</script>
<script src="nav.js"></script>
</body>
</html>
